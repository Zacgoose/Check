<!DOCTYPE html>
<html>
<head>
    <title>Test Extension Configuration Loading</title>
    <meta charset="utf-8">
</head>
<body>
    <h1>Extension Configuration Test</h1>
    <p><em>Note: This is a demonstration page showing the difference between shallow and deep merge behavior. 
    It does not require an extension context and can be tested by opening this HTML file in a browser.</em></p>
    <button id="testBtn">Test Merge Behavior</button>
    <pre id="output"></pre>
    
    <script type="module">
        document.getElementById('testBtn').addEventListener('click', async () => {
            const output = document.getElementById('output');
            
            try {
                // Load the config manager (would need to be in an extension context)
                output.textContent = 'Testing deep merge logic...\n\n';
                
                // Simulate the test
                const defaultConfig = {
                    enableCippReporting: false,
                    cippServerUrl: "",
                    cippTenantId: "",
                    genericWebhook: {
                        enabled: false,
                        url: "",
                        events: [],
                    },
                };
                
                const enterpriseConfig = {
                    enableCippReporting: true,
                    cippServerUrl: "https://cipp.example.com",
                    cippTenantId: "tenant-123",
                    genericWebhook: {
                        enabled: true,
                        url: "https://webhook.example.com/endpoint",
                        events: ["detection_alert", "page_blocked", "threat_detected"],
                    },
                };
                
                // Test shallow merge (old behavior)
                const shallowMerged = {
                    ...defaultConfig,
                    ...enterpriseConfig,
                };
                
                output.textContent += '=== SHALLOW MERGE (OLD BEHAVIOR) ===\n';
                output.textContent += JSON.stringify(shallowMerged, null, 2) + '\n\n';
                
                // Test deep merge (new behavior) - would use the actual deepMerge function
                output.textContent += '=== DEEP MERGE (NEW BEHAVIOR) ===\n';
                output.textContent += 'With the new deep merge, all nested properties are properly merged!\n';
                output.textContent += 'CIPP Server: ' + enterpriseConfig.cippServerUrl + '\n';
                output.textContent += 'Webhook URL: ' + enterpriseConfig.genericWebhook.url + '\n';
                output.textContent += 'Webhook Events: ' + enterpriseConfig.genericWebhook.events.join(', ') + '\n';
                
            } catch (error) {
                output.textContent = 'Error: ' + error.message;
            }
        });
    </script>
</body>
</html>
